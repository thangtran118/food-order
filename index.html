<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐶 Đặt Đồ Ăn Cùng Duyên 🍜</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Floating decorations -->
    <div class="decoration-container">
        <div class="heart heart-1">💖</div>
        <div class="heart heart-2">💕</div>
        <div class="heart heart-3">💗</div>
        <div class="heart heart-4">💝</div>
        <div class="sparkle sparkle-1">✨</div>
        <div class="sparkle sparkle-2">⭐</div>
        <div class="sparkle sparkle-3">🌟</div>
        <div class="sparkle sparkle-4">💫</div>
    </div>

    <!-- Cute animated dogs -->
    <div class="dog-container">
        <div class="dog dog-1">🐕</div>
        <div class="dog dog-2">🐶</div>
        <div class="dog dog-3">🦮</div>
        <div class="dog dog-4">🐕‍🦺</div>
    </div>

    <div class="page-wrapper">
        <div class="container">
            <div class="header">
                <h1 class="title">
                    <span class="emoji-bounce">🐾</span>
                    Đặt đồ ăn cùng Duyn
                    <span class="emoji-bounce">🐾</span>
                </h1>
                <p class="subtitle">Duyn siu deth á 💕 </p>
            </div>

            <form id="foodOrderForm">
                <div class="restaurant-section" id="main-restaurant">
                    <div class="form-group">
                        <label>
                            <span class="emoji">🔗</span>
                            Link quán
                        </label>
                        <input type="text"
                               name="restaurant-link"
                               placeholder="Ví dụ: https://grab.com/...">
                    </div>

                    <div class="form-group">
                        <label>
                            <span class="emoji">📝</span>
                            Note cho quán
                        </label>
                        <textarea name="restaurant-note"
                                  placeholder="Ví dụ: giao sớm giúp em, hạn chế cay..."></textarea>
                    </div>

                    <div class="food-items-container" id="food-items-container">
                        <!-- Food items will be added here -->
                    </div>

                    <button type="button" class="add-food-btn" onclick="addFoodItem()">
                        <span class="btn-icon">🍜</span>
                        <span>Thêm món nữa nha</span>
                        <span class="plus-icon">+</span>
                    </button>
                </div>

                <div class="submit-section">
                    <button type="submit" class="submit-btn">
                        <span>🎀</span>
                        Gửi nè 💕
                        <span>🎀</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Flowers decoration -->
    <div class="flower flower-1">🌸</div>
    <div class="flower flower-2">🌺</div>
    <div class="flower flower-3">🌷</div>
    <div class="flower flower-4">🌼</div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">🐶</div>
            <p class="loading-text">Đang gửi đơn hàng...</p>
        </div>
    </div>

    <!-- Cute Order Success Dialog -->
    <div id="orderSuccessDialog" class="dialog-overlay">
        <div class="dialog-content">
            <div class="dialog-header">
                <span class="sparkle-anim">✨</span>
                <span class="sparkle-anim">💖</span>
                <span class="sparkle-anim">✨</span>
            </div>
            <div class="dialog-body">
                <div class="success-icon">🎉</div>
                <p class="dialog-text">
                    Thắng nhận được rùi,<br>
                    đơn hàng <span class="text-bounce">tẻn tèn ten</span> đang tớiii
                </p>
                <div class="delivery-animation">
                    <div class="delivery-person">🛵</div>
                    <div class="delivery-road"></div>
                </div>
            </div>
            <button class="dialog-close-btn" onclick="closeOrderDialog()">
                Okii lunn 💕
            </button>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
